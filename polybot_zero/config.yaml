# polybot_zero config
# mode: measurement_only | selective_paper
mode: measurement_only

discovery:
  clob_api_url: "https://clob.polymarket.com"
  gamma_api_url: "https://gamma-api.polymarket.com"
  # Filter: question must contain one of these (case-insensitive)
  title_keywords: ["btc", "bitcoin"]
  # Window duration range to qualify as "5m" market
  min_window_secs: 240
  max_window_secs: 360
  # How often to re-scan for new markets (seconds)
  poll_interval_secs: 60

feeds:
  # RTDS — Polymarket Real-Time Data Service
  # Provides BOTH Chainlink canonical prices AND Binance auxiliary on one WebSocket.
  # No Polygon RPC. No separate Binance WebSocket.
  rtds:
    url: "wss://ws-live-data.polymarket.com"
    # Chainlink topic = canonical settlement truth
    chainlink_topic: "crypto_prices_chainlink"
    chainlink_symbol: "btc/usd"
    # Binance topic = auxiliary signal only (NOT settlement truth)
    binance_topic: "crypto_prices"
    binance_symbol: "btcusdt"
    # Freshness thresholds (seconds)
    chainlink_staleness_secs: 30
    # Gap threshold: RTDS has documented ~8s intermittent gaps (GitHub issue #31)
    # If silent for longer than this, gap_flag=True
    chainlink_gap_threshold_secs: 15
    binance_staleness_secs: 20
    # WebSocket reconnect / keepalive
    reconnect_delay_secs: 3
    ping_interval_secs: 5

  # CLOB WebSocket — order books only (separate service from RTDS)
  clob_ws:
    url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
    reconnect_delay_secs: 5

metadata:
  clob_api_url: "https://clob.polymarket.com"
  # Fee rate endpoint — fetched per token_id, NOT from market object
  fee_rate_endpoint: "https://clob.polymarket.com/fee-rate"
  # If true: fee_rate_bps must be confirmed from /fee-rate endpoint; else no-trade
  require_confirmed_fee: true

truth:
  # Chainlink capture must be within this many seconds of window boundary
  open_capture_tolerance_secs: 10
  close_capture_tolerance_secs: 10

no_trade:
  # Chainlink must be fresher than this (seconds)
  chainlink_max_staleness_secs: 30
  # Must have at least this many seconds left in window to consider entry
  min_secs_to_expiry: 30
  # Max acceptable spread on a $0-$1 outcome token
  max_spread: 0.10
  # pair_sum = up_best_ask + down_best_ask; structural check only
  pair_sum_min: 0.90
  pair_sum_max: 1.20

paper:
  # Maximum simultaneous open hypothetical positions (phase 2 only)
  max_open_positions: 1
  # Maximum USDC stake per trade
  max_stake_usdc: 5.0
  # Minimum observations in a bucket before it is considered for paper mode
  min_bucket_observations: 20
  # Minimum net edge in a bucket to qualify (after fees)
  min_bucket_net_edge: 0.02

analytics:
  # Minimum observations per bucket to include in edge report
  min_observations_for_report: 5

logging:
  log_dir: "logs"
  events_file: "events.jsonl"
  discovery_dump_file: "discovery_dump.jsonl"
  level: "DEBUG"

# Debug mode — set true to dump raw market JSON on first discovery poll
debug:
  market_inspector: false
  market_inspector_max: 20
