# polybot_zero config
# mode: measurement_only | selective_paper
mode: measurement_only

discovery:
  clob_api_url: "https://clob.polymarket.com"
  # Filter: question must contain one of these (case-insensitive)
  title_keywords: ["btc", "bitcoin"]
  # Window duration range to qualify as "5m" market
  min_window_secs: 240
  max_window_secs: 360
  # How often to re-scan for new markets
  poll_interval_secs: 60

feeds:
  chainlink:
    # Polygon Mainnet RPC — replace with your own for reliability
    polygon_rpc_url: "https://polygon-rpc.com"
    # BTC/USD Chainlink aggregator on Polygon Mainnet
    btcusd_aggregator: "0xc907E116054Ad103354f2D350FD2514433D57F6f"
    # How often to poll chain (seconds)
    poll_interval_secs: 10
    # If no fresh update within this window, declare stale
    staleness_threshold_secs: 45

  binance:
    ws_url: "wss://stream.binance.com:9443/ws/btcusdt@bookTicker"
    staleness_threshold_secs: 20
    reconnect_delay_secs: 5

  polymarket_ws:
    url: "wss://ws-subscriptions-clob.polymarket.com/ws/"
    staleness_threshold_secs: 30
    reconnect_delay_secs: 5

metadata:
  clob_api_url: "https://clob.polymarket.com"
  # If true: fee_rate must come from API. If missing, no-trade.
  require_fee_from_api: true

truth:
  # Chainlink capture must be within this many seconds of window boundary
  open_capture_tolerance_secs: 8
  close_capture_tolerance_secs: 8

book:
  # Max acceptable spread on a $0-$1 outcome token
  max_spread: 0.10
  # pair_sum = up_best_ask + down_best_ask; market-structure metric only — NOT a fee source
  pair_sum_min: 0.90
  pair_sum_max: 1.20
  # Minimum number of levels on each side before orderbook is valid
  min_bid_levels: 1
  min_ask_levels: 1

no_trade:
  # Chainlink must be fresher than this
  chainlink_max_staleness_secs: 45
  # Binance must be fresher than this (it's auxiliary, but stale = reduced signal)
  binance_max_staleness_secs: 20
  # Must have at least this many seconds left in window to consider entry
  min_secs_to_expiry: 30
  # Spread / pair_sum limits (from book section above, re-stated for clarity)
  max_spread: 0.10
  pair_sum_min: 0.90
  pair_sum_max: 1.20

paper:
  # Maximum simultaneous open hypothetical positions (phase 2 only)
  max_open_positions: 1
  # Maximum USDC stake per trade (phase 2 only)
  max_stake_usdc: 5.0
  # Minimum observations in a bucket before it is considered for paper mode
  min_bucket_observations: 20
  # Minimum win rate in a bucket to qualify (after fees)
  min_bucket_net_edge: 0.02

analytics:
  # Minimum observations per bucket to include in edge report
  min_observations_for_report: 5

logging:
  log_dir: "logs"
  events_file: "events.jsonl"
  summary_file: "summary.jsonl"
  level: "DEBUG"
